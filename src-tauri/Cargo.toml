[package]
name = "gilbert-codex"
version = "0.1.0"
description = "GUI-first local agent workspace."
authors = ["Gilbert Codex Contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "gilbert_codex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
reqwest = "0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
