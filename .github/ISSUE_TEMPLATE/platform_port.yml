name: Platform support report
description: Track macOS or Linux source, packaging, or runtime support.
title: "[Platform]: "
labels: ["help wanted"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS arm64
        - macOS x64
        - Linux x64
        - Linux arm64
        - Windows x64
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: macOS 15.5, Ubuntu 24.04, Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands run
      description: Include install, dev, check, and build commands that were actually run.
      render: text
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result
      description: What worked, what failed, and what remains unverified?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove secrets, private paths, and local workspace data before posting.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed provider keys, tokens, local databases, private workspace data, and sensitive terminal output.
          required: true
