name: Bug report
description: Report a reproducible Gilbert Codex problem.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Gilbert Codex. Do not include provider keys, local databases, private workspace data, or sensitive terminal output.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and the user-visible result.
      placeholder: The app did X when I expected Y.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest path that reproduces the bug.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Chat workspace
        - Model/provider runtime
        - Tools or Toolbox
        - Local files or terminal
        - Git or GitHub integration
        - Web search or browser preview
        - Settings
        - Desktop shell or installer
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: v0.0.1-alpha or commit SHA
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 x64, macOS 15 arm64, Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, short logs, or command output after removing secrets and private paths.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed provider keys, tokens, local databases, private workspace data, and sensitive terminal output.
          required: true
