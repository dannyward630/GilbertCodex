name: CI

on:
  pull_request:
    branches:
      - main
      - develop
      - testing
  push:
    branches:
      - main
      - develop
      - testing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build:
    name: frontend-build
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare public tool bridge shim
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/prepare-public-toolbridge-shim.ps1

      - name: Build frontend
        run: npm run build

  rust-host:
    name: rust-host
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Check Rust host
        run: cargo check --manifest-path src-tauri/Cargo.toml
