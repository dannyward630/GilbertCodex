<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gilbert Codex logo</title>
  <desc id="desc">A dark rounded square with a custom G-shaped agent loop and terminal prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="145" y1="107" x2="889" y2="917" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1d232b" />
      <stop offset="0.52" stop-color="#111317" />
      <stop offset="1" stop-color="#2a2118" />
    </linearGradient>
    <linearGradient id="mainStroke" x1="237" y1="244" x2="822" y2="792" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f7f3ea" />
      <stop offset="0.48" stop-color="#dfe9e2" />
      <stop offset="1" stop-color="#c8a656" />
    </linearGradient>
    <radialGradient id="greenGlow" cx="0" cy="0" r="1" gradientTransform="matrix(375 0 0 375 320 220)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#73ddb3" stop-opacity="0.42" />
      <stop offset="1" stop-color="#73ddb3" stop-opacity="0" />
